<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Timbratrice Admin</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <style>
    :root{
      --bg:#0b0b0c;
      --card:#141417;
      --card2:#17171b;
      --text:#f2f2f2;
      --muted:#b8b8bf;
      --line:rgba(255,255,255,.18);
      --red:#D22B2B;
      --red2:#b21f1f;
      --good:#3ddc84;
      --warn:#ffb020;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius:18px;
      --radius2:14px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }
    @media (prefers-color-scheme: light){
      :root{
        --bg:#f5f5f7;
        --card:#ffffff;
        --card2:#fafafa;
        --text:#121212;
        --muted:#6c6c75;
        --line:rgba(0,0,0,.18);
        --shadow: 0 10px 30px rgba(0,0,0,.10);
      }
    }
    *{box-sizing:border-box}
    html,body{min-height:100%; width:100%; overflow-x:hidden}
    body{
      margin:0;
      font-family:var(--sans);
      background:linear-gradient(180deg, rgba(210,43,43,.12), transparent 40%), var(--bg);
      color:var(--text);
    }
    .topbar{
      position:sticky; top:0; z-index:20;
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 16px;
      background:rgba(0,0,0,.18);
      backdrop-filter: blur(12px);
      border-bottom:1px solid var(--line);
    }
    @media (prefers-color-scheme: light){
      .topbar{background:rgba(255,255,255,.70)}
    }
    .brand{font-weight:900; letter-spacing:.2px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
    .right{display:flex; align-items:center; gap:10px; min-width:0}
    .userPill{
      border:1px solid var(--line);
      background:transparent;
      color:var(--muted);
      padding:8px 10px;
      border-radius:999px;
      font-weight:800;
      font-size:12px;
      max-width:52vw;
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .iconSprite{position:absolute; width:0; height:0; overflow:hidden}
    .icon{
      width:18px; height:18px;
      stroke:currentColor; fill:none; stroke-width:1.8;
      stroke-linecap:round; stroke-linejoin:round;
      flex:0 0 auto;
    }
    .icon.xs{width:14px; height:14px}
    .icon.sm{width:16px; height:16px}
    .iconLabel{display:inline-flex; align-items:center; gap:6px}
    .wrap{max-width:1440px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:14px}
    .card{
      background:var(--card);
      border-radius:var(--radius);
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      padding:14px;
    }
    .h2{font-weight:900; font-size:18px}
    .sub{color:var(--muted); font-size:13px; margin-top:2px}
    .field{display:flex; flex-direction:column; gap:6px}
    .field > span{font-size:12px; color:var(--muted); font-weight:800}
    input, select{
      width:100%;
      padding:12px 12px;
      border-radius:14px;
      border:1px solid var(--line);
      background:var(--card2);
      color:var(--text);
      outline:none;
      font-size:14px;
    }
    input:focus, select:focus{border-color: rgba(210,43,43,.55)}
    .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:12px}
    .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px}
    .grid1{display:grid; grid-template-columns:1fr; gap:10px; margin-top:12px}
    @media (max-width:760px){
      .grid3{grid-template-columns:1fr}
      .grid2{grid-template-columns:1fr}
      .grid1{grid-template-columns:1fr}
    }
    @media (max-width:520px){
      .topbar{padding:10px 12px}
      .wrap{padding:10px 12px; gap:10px}
      .card{padding:12px; border-radius:18px}
      .item{padding:10px}
      .metaBox{padding:6px 8px}
      .chips3{gap:8px}
    }
    .row{display:flex; gap:10px; margin-top:12px}
    .btn{
      padding:12px 14px;
      border-radius:14px;
      border:1px solid var(--line);
      background:var(--card2);
      color:var(--text);
      font-weight:900;
      cursor:pointer;
      flex:1;
    }
    .btn.primary{
      background:linear-gradient(180deg, var(--red), var(--red2));
      border-color:rgba(255,255,255,.10);
      color:white;
    }
    .btn.danger{background:rgba(255,70,70,.10); border-color:rgba(255,70,70,.25)}
    .btn:disabled{opacity:.45; cursor:not-allowed}
    .adminFilters .field{
      background:var(--card2);
      border:1px solid var(--line);
      border-radius:12px;
      padding:8px 10px;
    }
    .adminFilters .field > span{color:var(--muted)}
    .adminFilters .field input,
    .adminFilters .field select{
      background:transparent;
      border:none;
      padding:5px 0 2px;
      font-size:13px;
    }
    .adminFilters .field input:focus,
    .adminFilters .field select:focus{
      border:none;
    }
    .adminFiltersBar{
      display:grid;
      gap:8px 10px;
      margin-top:10px;
      align-items:end;
    }
    .adminFiltersBar .btn{
      padding:10px 12px;
      font-size:13px;
      min-height:44px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    @media (min-width:1200px){
      .adminFiltersBar{
        grid-template-columns:
          minmax(200px, 1.4fr)
          minmax(120px, .9fr)
          minmax(120px, .9fr)
          minmax(120px, .8fr)
          minmax(120px, .8fr)
          minmax(150px, .9fr)
          minmax(130px, .8fr)
          minmax(130px, .8fr);
      }
    }
    @media (max-width:1199px){
      .adminFiltersBar{
        grid-template-columns: repeat(4, minmax(160px, 1fr));
      }
    }
    @media (max-width:900px){
      .adminFiltersBar{
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    .chips3{display:flex; gap:10px; margin-top:12px}
    .chip{
      flex:1;
      background:var(--card2);
      border:1px solid var(--line);
      border-radius:var(--radius2);
      padding:10px 12px;
      min-width:0;
    }
    .chipLabel{font-size:12px; color:var(--muted); font-weight:800; letter-spacing:.2px}
    .chipValue{
      margin-top:4px;
      font-family:var(--mono);
      font-size:18px;
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .list{display:flex; flex-direction:column; gap:10px; margin-top:10px; width:100%}
    .item{
      border:1px solid var(--line);
      background:var(--card2);
      border-radius:16px;
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .itemTop{display:flex; justify-content:space-between; gap:10px; align-items:center}
    .paidToggle{display:inline-flex; align-items:center; gap:6px; font-weight:800; color:var(--muted)}
    .paidToggle input{width:18px; height:18px; padding:0}
    .itemTitle{font-weight:900}
    .itemMeta{font-family:var(--mono); color:var(--muted); font-size:12px}
    .itemMetaGrid{
      display:grid;
      grid-template-columns:1.6fr 1.2fr 1.2fr .7fr .6fr;
      gap:8px;
      margin-top:8px;
    }
    .metaBox{
      border:1px solid var(--line);
      background:var(--card);
      border-radius:12px;
      padding:8px 10px;
      min-width:0;
    }
    .metaLabel{
      display:flex;
      align-items:center;
      gap:6px;
      font-size:11px;
      color:var(--muted);
      font-weight:800;
      letter-spacing:.2px;
    }
    .metaValue{
      margin-top:3px;
      font-family:var(--mono);
      font-size:14px;
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    @media (min-width:1100px){
      .itemTitle{font-size:18px}
      .metaValue{font-size:15px}
    }
    @media (max-width:980px){
      .itemMetaGrid{grid-template-columns:repeat(2, minmax(0, 1fr))}
    }
    .empty{
      text-align:center;
      color:var(--muted);
      padding:18px 8px;
      border:1px dashed var(--line);
      border-radius:16px;
      margin-top:10px;
    }
    .msg{
      font-size:13px;
      color:var(--muted);
      margin-top:2px;
      min-height:18px;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid var(--line);
      background:rgba(0,0,0,.06);
      line-height:1.35;
    }
    @media (prefers-color-scheme: light){
      .msg{background:rgba(0,0,0,.03)}
    }
    .msg.ok{color:var(--good)}
    .msg.err{color:#ff6b6b}
    .hidden{display:none!important}
  </style>
</head>

  <script>
    const SUPABASE_URL_RAW = "https://rvznuudatshqyzmnqrmd.supabase.co";

    const SUPABASE_URL = (SUPABASE_URL_RAW || "").trim();

    const $ = (id) => document.getElementById(id);
    const pad2 = (n) => String(n).padStart(2, "0");
    const fmtHM = (min) => {

let currentUser = null;
let currentSession = null; // cache in-memory session (access_token)
let records = [];
let autoDateInitialized = false;
let userLabelById = new Map();

function isoDate(isoTs){
  if(!isoTs) return "";
  const d = new Date(isoTs);
  const yyyy = d.getFullYear();
  const mm = pad2(d.getMonth()+1);
  const dd = pad2(d.getDate());
  return `${yyyy}-${mm}-${dd}`;
}

function initDateRangeFromRecordsOnce(){
  if(autoDateInitialized) return;
  if(!records || records.length === 0) return;

  const dates = records
    .map(r => r.start_ts)
    .filter(Boolean)
    .map(ts => new Date(ts))
    .filter(d => !isNaN(d.getTime()));

  if(dates.length === 0) return;

  dates.sort((a,b)=> a.getTime() - b.getTime());
  const minD = dates[0];
  const maxD = dates[dates.length-1];

  // Only set if user hasn't already picked dates
  const fromEl = $("fromDate");
  const toEl = $("toDate");
  if(!fromEl.value) fromEl.value = isoDate(minD.toISOString());
  if(!toEl.value) toEl.value = isoDate(maxD.toISOString());

  autoDateInitialized = true;
}

function withTimeout(promise, ms, label){
  let timerId;
  const timeout = new Promise((_, reject)=>{
    timerId = setTimeout(()=>{
      reject(new Error(`${label} non risponde. Riprova.`));
    }, ms);
  });
  return Promise.race([promise, timeout]).finally(()=> clearTimeout(timerId));
}

async function fetchWithTimeout(url, options, ms=12000, label="Richiesta"){
  return withTimeout(fetch(url, options), ms, label);
}

function buildRestHeaders(token){
  return {
    apikey: SUPABASE_ANON_KEY,
    Authorization: `Bearer ${token || SUPABASE_ANON_KEY}`,
    "Content-Type": "application/json",
  };
}

async function restGet(path, token, ms=12000, label="Caricamento"){
  const url = `${SUPABASE_URL}${path}`;
  const res = await fetchWithTimeout(url, { method: "GET", headers: buildRestHeaders(token) }, ms, label);
  const text = await res.text();
  let json = null;
  try{ json = text ? JSON.parse(text) : null; }catch{ json = null; }
  if(!res.ok){
    const msg = (json && (json.message || json.error || json.error_description)) || text || `HTTP ${res.status}`;
    const err = new Error(msg);
    err.status = res.status;
    err.body = json || text;
    throw err;
  }
  return json;
}

async function updatePaidStatus(id, paid){
  if(!id) throw new Error("ID record mancante.");
  const token = getToken();
  if(!token) throw new Error("Sessione non valida: rifai Login.");
  const url = `${SUPABASE_URL}/rest/v1/work_records?id=eq.${encodeURIComponent(id)}`;
  const headers = {
    ...buildRestHeaders(token),
    Prefer: "return=minimal"
  };
  const res = await fetchWithTimeout(url, {
    method: "PATCH",
    headers,
    body: JSON.stringify({ paid: !!paid })
  }, 12000, "Aggiornamento pagato");
  if(!res.ok){
    const text = await res.text();
    let json = null;
    try{ json = text ? JSON.parse(text) : null; }catch{ json = null; }
    const msg = (json && (json.message || json.error || json.error_description)) || text || `HTTP ${res.status}`;
    const err = new Error(msg);
    err.status = res.status;
    throw err;
  }
}

function getToken(){
  return currentSession?.access_token || "";
}

async function getUser(){
  if(currentUser) return currentUser;
  if(currentSession?.user){
    currentUser = currentSession.user;
    return currentUser;
  }
  // bounded fallback (best effort)
  try{
    const { data } = await withTimeout(sb.auth.getSession(), 4000, "Sessione");
    const u = data?.session?.user || null;
    if(u) currentUser = u;
    if(data?.session) currentSession = data.session;
    return u;
  }catch{
    return null;
  }
}

    function setAuthUI(user){
      const pill = $("userPill");
      currentUser = user || null;

      const userEmailNorm = (user?.email || "").trim().toLowerCase();
      if(user){
        pill.textContent = user.email || "Loggato";
      }else{
        pill.textContent = "Non loggato";
      }

      const isAdmin = !!user && userEmailNorm === ADMIN_EMAIL_NORM;
      $("adminCard").classList.toggle("hidden", !isAdmin);
      $("loginCard").classList.toggle("hidden", isAdmin);

      if(user && !isAdmin){
        setAuthMsg("❌ Accesso negato: questo account non è admin.", "err");
      }

      if(!user){
        setAuthMsg("", null);
        setActionMsg("", null);
        records = [];
        renderSummary();
        renderList();
      }
    }

    function setAuthMsg(text, kind){
      const el = $("authMsg");
      el.textContent = text || "";
      el.classList.remove("ok","err");
      if(kind) el.classList.add(kind);
    }

    function setActionMsg(text, kind){
      const el = $("actionMsg");
      el.textContent = text || "";
      el.classList.remove("ok","err");
      if(kind) el.classList.add(kind);
    }

    function getUserLabelFromRecord(record){
      const name = String(record?.user_name || "").trim();
      if(name) return name;
      const id = record?.user_id ? String(record.user_id) : "";
      const fromMap = id ? userLabelById.get(id) : "";
      if(fromMap) return fromMap;
      const email = String(record?.user_email || "").trim();
      return email || "—";
    }

    function getUserLabelFromId(id){
      const key = String(id || "").trim();
      if(!key) return "";
      return userLabelById.get(key) || key;
    }

    function renderList(){
      const list = $("list");
      list.innerHTML = "";
      if(records.length === 0){
        $("empty").classList.remove("hidden");
        return;
      }
      $("empty").classList.add("hidden");
      for(const r of records){
        const start = r.start_ts ? new Date(r.start_ts).toLocaleString("it-IT") : "—";
        const end = r.end_ts ? new Date(r.end_ts).toLocaleString("it-IT") : "—";
        const userLabel = getUserLabelFromRecord(r);
        const paidChecked = !!r.paid;
        const el = document.createElement("div");
        el.className = "item";
        el.innerHTML = `
          <div class="itemTop">
            <div class="itemTitle">${escapeHTML(r.title || "Senza titolo")}</div>
            <label class="paidToggle">
              <input type="checkbox" data-paid-id="${r.id}" ${paidChecked ? "checked" : ""}>
              <span>Pagato</span>
            </label>
          </div>
          <div class="itemMetaGrid">
            <div class="metaBox">
              <div class="metaLabel"><svg class="icon xs" aria-hidden="true"><use href="#i-mail"></use></svg>Utente</div>
              <div class="metaValue">${escapeHTML(userLabel)}</div>
            </div>
            <div class="metaBox">
              <div class="metaLabel"><svg class="icon xs" aria-hidden="true"><use href="#i-calendar"></use></svg>Inizio</div>
              <div class="metaValue">${escapeHTML(start)}</div>
            </div>
            <div class="metaBox">
              <div class="metaLabel"><svg class="icon xs" aria-hidden="true"><use href="#i-calendar"></use></svg>Fine</div>
              <div class="metaValue">${escapeHTML(end)}</div>
            </div>
            <div class="metaBox">
              <div class="metaLabel"><svg class="icon xs" aria-hidden="true"><use href="#i-pause"></use></svg>Pausa</div>
              <div class="metaValue">${escapeHTML(fmtHM(r.pause_min||0))}</div>
            </div>
            <div class="metaBox">
              <div class="metaLabel"><svg class="icon xs" aria-hidden="true"><use href="#i-car"></use></svg>Km</div>
              <div class="metaValue">${escapeHTML(String(r.km||0))}</div>
            </div>
          </div>
        `;
        list.appendChild(el);
      }
      list.querySelectorAll("[data-paid-id]").forEach(input=>{
        input.addEventListener("change", async (e)=>{
          const el = e.currentTarget;
          const id = el.getAttribute("data-paid-id");
          const checked = el.checked;
          try{
            el.disabled = true;
            await updatePaidStatus(id, checked);
            const rec = records.find(r => String(r.id) === String(id));
            if(rec) rec.paid = checked;
            if(($("paidFilter").value || "").trim()){
              await refresh();
            }
          }catch(err){
            el.checked = !checked;
            setActionMsg(`❌ ${err.message || String(err)}`, "err");
          }finally{
            el.disabled = false;
          }
        });
      });
    }

    function renderSummary(){
      $("sumRecords").textContent = String(records.length);
      const sumWork = records.reduce((a,r)=> a + Number(r.work_min||0), 0);
      const sumKm = records.reduce((a,r)=> a + Number(r.km||0), 0);
      $("sumHours").textContent = fmtHM(sumWork);
      $("sumKm").textContent = String(sumKm);
    }

    function escapeHTML(s){
      return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
    }

async function loadUsers(){
  const user = await getUser();
  const userEmailNorm = (user?.email || "").trim().toLowerCase();
  if(!user || userEmailNorm !== ADMIN_EMAIL_NORM) return;

  try{
    const token = getToken();
    // distinct users via client-side unique
    const data = await restGet(
      "/rest/v1/work_records_admin_view?select=user_id,user_name,user_email&user_id=not.is.null&limit=1000",
      token,
      12000,
      "Caricamento utenti"
    );
    userLabelById = new Map();
    for(const row of (data || [])){
      const id = String(row.user_id || "").trim();
      if(!id) continue;
      const name = String(row.user_name || "").trim();
      const email = String(row.user_email || "").trim();
      const label = name || email;
      if(label && !userLabelById.has(id)) userLabelById.set(id, label);
    }
    const entries = Array.from(userLabelById.entries())
      .sort((a,b)=> a[1].localeCompare(b[1], "it"));

    const sel = $("userSelect");
    sel.innerHTML = '<option value="">Tutte</option>';
    for(const [id, label] of entries){
      const opt2 = document.createElement("option");
      opt2.value = id;
      opt2.textContent = label;
      sel.appendChild(opt2);
    }
  }catch(err){
    console.warn("Lista utenti non disponibile", err);
  }
}

async function refresh(){
  const user = await getUser();
  const userEmailNorm = (user?.email || "").trim().toLowerCase();
  if(!user || userEmailNorm !== ADMIN_EMAIL_NORM){
    setAuthUI(user);
    return;
  }

  const token = getToken();
  if(!token){
    setActionMsg("❌ Nessuna sessione/token. Rifai Login.", "err");
    return;
  }

  const userFilterId = ($("userSelect").value || "").trim();
  const paidFilter = ($("paidFilter").value || "").trim();
  const fromDate = $("fromDate").value;
  const toDate = $("toDate").value;
  const sortField = $("sortField").value;
  const sortAsc = $("sortDir").value === "asc";

  try{
    setActionMsg("⏳ Caricamento...", null);

    // Build PostgREST querystring
    const params = [];
    params.push("select=*");
    if(userFilterId) params.push(`user_id=eq.${encodeURIComponent(userFilterId)}`);
    if(paidFilter === "paid") params.push("paid=is.true");
    if(paidFilter === "unpaid") params.push("or=(paid.is.false,paid.is.null)");
    if(fromDate) params.push(`start_ts=gte.${encodeURIComponent(new Date(fromDate + "T00:00:00").toISOString())}`);
    if(toDate) params.push(`start_ts=lte.${encodeURIComponent(new Date(toDate + "T23:59:59").toISOString())}`);
    params.push(`order=${encodeURIComponent(sortField)}.${sortAsc ? "asc" : "desc"}`);

    const path = `/rest/v1/work_records_admin_view?${params.join("&")}`;
    const data = await restGet(path, token, 12000, "Caricamento");

    records = data || [];
    renderSummary();
    renderList();
    initDateRangeFromRecordsOnce();

    if(records.length === 0){
      setActionMsg("⚠️ Nessun record trovato (filtri troppo stretti o dati assenti).", "err");
    }else{
      setActionMsg(`✅ ${records.length} record`, "ok");
    }
  }catch(err){
    console.error(err);
    setActionMsg(`❌ ${err.message || String(err)}${err.status ? ` (HTTP ${err.status})` : ""}`, "err");
  }
}

    function exportCSV(){
      const sep = ";";
      const rows = [...records];

      const dt = (iso)=>{
        if(!iso) return "";
        const d = new Date(iso);
        const yyyy = d.getFullYear();
        const mm = pad2(d.getMonth()+1);
        const dd = pad2(d.getDate());
        const HH = pad2(d.getHours());
        const MI = pad2(d.getMinutes());
        return `${yyyy}/${mm}/${dd} ${HH}:${MI}`;
      };

      let csv = "\uFEFF";
      csv += ["Utente","Titolo","DataOraInizio","DataOraFine","Pausa_min","Ore_nette_hh:mm","Km"].join(sep) + "\r\n";

      let sumWork = 0, sumKm = 0;
      for(const r of rows){
        sumWork += Number(r.work_min||0);
        sumKm += Number(r.km||0);
        csv += [
          csvEscape(getUserLabelFromRecord(r), sep),
          csvEscape(r.title||"", sep),
          dt(r.start_ts),
          dt(r.end_ts),
          String(Number(r.pause_min||0)),
          fmtHM(Number(r.work_min||0)),
          String(Number(r.km||0))
        ].join(sep) + "\r\n";
      }

      csv += ["TOTALE SELEZIONE","","","", fmtHM(sumWork), String(sumKm)].join(sep) + "\r\n";

      const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `timbratrice-admin-${Date.now()}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function exportPDF(){
      const rows = [...records];
      if(rows.length === 0){
        setActionMsg("Nessun record da esportare.", "err");
        return;
      }

      const dt = (iso)=>{
        if(!iso) return "";
        const d = new Date(iso);
        const yyyy = d.getFullYear();
        const mm = pad2(d.getMonth()+1);
        const dd = pad2(d.getDate());
        const HH = pad2(d.getHours());
        const MI = pad2(d.getMinutes());
        return `${yyyy}/${mm}/${dd} ${HH}:${MI}`;
      };

      let sumWork = 0;
      let sumKm = 0;
      let sumPause = 0;
      for(const r of rows){
        sumWork += Number(r.work_min||0);
        sumKm += Number(r.km||0);
        sumPause += Number(r.pause_min||0);
      }

      const userFilterId = ($("userSelect").value || "").trim();
      const userFilterLabel = userFilterId ? getUserLabelFromId(userFilterId) : "";
      const fromDate = $("fromDate").value;
      const toDate = $("toDate").value;
      const sortField = $("sortField").value;
      const sortDir = $("sortDir").value;
      const nowText = new Date().toLocaleString("it-IT");

      const rowsHtml = rows.map((r, i)=>{
        const userLabel = escapeHTML(getUserLabelFromRecord(r));
        const t = escapeHTML(r.title || "Senza titolo");
        const start = escapeHTML(dt(r.start_ts));
        const end = escapeHTML(dt(r.end_ts));
        const pause = escapeHTML(fmtHM(Number(r.pause_min||0)));
        const work = escapeHTML(fmtHM(Number(r.work_min||0)));
        const km = escapeHTML(String(Number(r.km||0)));
        const zebra = i % 2 ? " class=\"alt\"" : "";
        return `<tr${zebra}>
  <td>${userLabel}</td>
  <td>${t}</td>
  <td class="nowrap">${start}</td>
  <td class="nowrap">${end}</td>
  <td class="center">${pause}</td>
  <td class="center">${work}</td>
  <td class="right">${km}</td>
</tr>`;
      }).join("");

      const meta = [
        userFilterLabel ? `Utente: ${escapeHTML(userFilterLabel)}` : "",
        (fromDate || toDate) ? `Intervallo: ${escapeHTML(fromDate || "")} ${toDate ? "-> " + escapeHTML(toDate) : ""}` : "",
        `Ordinamento: ${escapeHTML(sortField)} ${escapeHTML(sortDir)}`,
        `Generato: ${escapeHTML(nowText)}`
      ].filter(Boolean);

      const metaLines = meta.map(line => `<div class="meta">${line}</div>`).join("");

      const html = `<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Timbratrice-Admin-PDF</title>
  <style>
    @page { size: A4; margin: 18mm 14mm; }
    body{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color:#111; }
    h1{ font-size:20px; margin:0 0 6px; }
    .meta{ font-size:12px; color:#555; margin-bottom:3px; }
    table{ width:100%; border-collapse:collapse; margin-top:12px; }
    th, td{ font-size:10px; padding:6px 6px; border-bottom:1px solid #ddd; vertical-align:top; }
    th{ background:#f2f2f2; text-align:left; }
    tr.alt td{ background:#fafafa; }
    .right{ text-align:right; }
    .center{ text-align:center; }
    .nowrap{ white-space:nowrap; }
    .totals{ margin-top:12px; font-size:12px; }
  </style>
</head>
<body>
  <h1>Timbratrice Admin</h1>
  ${metaLines}
  <table>
    <thead>
      <tr>
        <th>Utente</th>
        <th>Titolo</th>
        <th>Inizio</th>
        <th>Fine</th>
        <th>Pausa</th>
        <th>Ore</th>
        <th class="right">Km</th>
      </tr>
    </thead>
    <tbody>
      ${rowsHtml}
    </tbody>
  </table>
  <div class="totals">
    Tot ore: ${escapeHTML(fmtHM(sumWork))} &nbsp;•&nbsp;
    Tot pausa: ${escapeHTML(fmtHM(sumPause))} &nbsp;•&nbsp;
    Tot km: ${escapeHTML(String(sumKm))} &nbsp;•&nbsp;
    Record: ${rows.length}
  </div>
</body>
</html>`;

      const win = window.open("", "_blank");
      if(!win){
        setActionMsg("Popup bloccato: abilita per esportare PDF.", "err");
        return;
      }
      win.document.open();
      win.document.write(html);
      win.document.close();
      win.document.title = `timbratrice-admin-${Date.now()}`;
      win.focus();
      win.onload = () => {
        win.print();
        setTimeout(()=>{ try{ win.close(); }catch{} }, 300);
      };
    }

    function csvEscape(s, sep){
      const t = String(s||"").trim();
      if(t.includes(sep) || t.includes('"') || t.includes("\n") || t.includes("\r")){
        return `"${t.replace(/"/g,'""')}"`;
      }
      return t;
    }

$("btnLogin").addEventListener("click", async ()=>{
  try{
    setAuthMsg("⏳ Login...", null);
    const email = ($("emailInput").value||"").trim();
    const pass = ($("passInput").value||"").trim();
    if(!email || !pass) throw new Error("Inserisci email e password.");
    const { data, error } = await withTimeout(
      sb.auth.signInWithPassword({ email, password: pass }),
      10000,
      "Login"
    );
    if(error) throw error;
    if(!data?.session) throw new Error("Login non riuscito.");
    currentSession = data.session;
    setAuthMsg("✅ Login OK", "ok");
    setAuthUI(data.session.user);
    await loadUsers();
    await refresh();
  }catch(err){
    setAuthMsg("❌ " + (err.message || String(err)), "err");
  }
});

$("btnLogout").addEventListener("click", async ()=>{
  try{
    await sb.auth.signOut();
  }catch(err){
    console.warn("Logout error:", err);
  }
  currentSession = null;
  currentUser = null;
  records = [];
  setAuthUI(null);
  setAuthMsg("✅ Logout", "ok");
});

    $("btnExport").addEventListener("click", exportCSV);
    $("btnExportPdf").addEventListener("click", exportPDF);
    $("btnClear").addEventListener("click", ()=>{
      $("userSelect").value = "";
      $("paidFilter").value = "";
      $("fromDate").value = "";
      $("toDate").value = "";
      $("sortField").value = "start_ts";
      $("sortDir").value = "desc";
      autoDateInitialized = false;
      refresh();
    });

    $("userSelect").addEventListener("change", ()=>{
      refresh();
    });
    $("paidFilter").addEventListener("change", ()=>{
      refresh();
    });
    $("fromDate").addEventListener("change", ()=> refresh());
    $("toDate").addEventListener("change", ()=> refresh());
    $("sortField").addEventListener("change", ()=> refresh());
    $("sortDir").addEventListener("change", ()=> refresh());

sb?.auth.onAuthStateChange(async (_event, session)=>{
  currentSession = session || null;
  const user = session?.user || null;
  setAuthUI(user);
  await loadUsers();
  await refresh();
});

    (async function boot(){
      const user = await getUser();
      setAuthUI(user);
      await loadUsers();
      await refresh();
    })();
  </script>
</body>
