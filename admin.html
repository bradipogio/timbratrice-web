<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Timbratrice Admin</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <style>
    :root{
      --bg:#0b0b0c;
      --card:#141417;
      --card2:#17171b;
      --text:#f2f2f2;
      --muted:#b8b8bf;
      --line:rgba(255,255,255,.65);
      --red:#D22B2B;
      --red2:#b21f1f;
      --good:#3ddc84;
      --warn:#ffb020;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius:18px;
      --radius2:14px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }
    @media (prefers-color-scheme: light){
      :root{
        --bg:#f5f5f7;
        --card:#ffffff;
        --card2:#fafafa;
        --text:#121212;
        --muted:#6c6c75;
        --line:rgba(0,0,0,.35);
        --shadow: 0 10px 30px rgba(0,0,0,.10);
      }
    }
    *{box-sizing:border-box}
    html,body{min-height:100%; width:100%; overflow-x:hidden}
    body{
      margin:0;
      font-family:var(--sans);
      background:linear-gradient(180deg, rgba(210,43,43,.12), transparent 40%), var(--bg);
      color:var(--text);
    }
    .topbar{
      position:sticky; top:0; z-index:20;
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 16px;
      background:rgba(0,0,0,.18);
      backdrop-filter: blur(12px);
      border-bottom:1px solid var(--line);
    }
    @media (prefers-color-scheme: light){
      .topbar{background:rgba(255,255,255,.70)}
    }
    .brand{font-weight:900; letter-spacing:.2px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
    .right{display:flex; align-items:center; gap:10px; min-width:0}
    .userPill{
      border:1px solid var(--line);
      background:transparent;
      color:var(--muted);
      padding:8px 10px;
      border-radius:999px;
      font-weight:800;
      font-size:12px;
      max-width:52vw;
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .iconBtn{
      border:1px solid var(--line);
      background:transparent;
      color:var(--text);
      padding:10px 12px;
      border-radius:12px;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }
    .icon{
      width:18px; height:18px;
      stroke:currentColor; fill:none; stroke-width:1.8;
      stroke-linecap:round; stroke-linejoin:round;
      flex:0 0 auto;
    }
    .icon.sm{width:16px; height:16px}
    .iconSprite{position:absolute; width:0; height:0; overflow:hidden}
    .icon.xs{width:14px; height:14px}
    .iconLabel{display:inline-flex; align-items:center; gap:6px}
    .wrap{max-width:1440px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:14px}
    .card{
      background:var(--card);
      border-radius:var(--radius);
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      padding:14px;
    }
    .h2{font-weight:900; font-size:18px}
    .sub{color:var(--muted); font-size:13px; margin-top:2px}
    .field{display:flex; flex-direction:column; gap:6px}
    .field > span{font-size:12px; color:var(--muted); font-weight:800}
    input, select{
      width:100%;
      padding:12px 12px;
      border-radius:14px;
      border:1px solid var(--line);
      background:var(--card2);
      color:var(--text);
      outline:none;
      font-size:14px;
    }
    input:focus, select:focus{border-color: rgba(210,43,43,.55)}
    .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:12px}
    .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px}
    .grid1{display:grid; grid-template-columns:1fr; gap:10px; margin-top:12px}
    @media (max-width:760px){
      .grid3{grid-template-columns:1fr}
      .grid2{grid-template-columns:1fr}
      .grid1{grid-template-columns:1fr}
    }
    @media (max-width:520px){
      .topbar{padding:10px 12px}
      .wrap{padding:10px 12px; gap:10px}
      .card{padding:12px; border-radius:18px}
      .item{padding:10px}
      .metaBox{padding:6px 8px}
      .chips3{gap:8px}
    }
    .row{display:flex; gap:10px; margin-top:12px}
    .btn{
      padding:12px 14px;
      border-radius:14px;
      border:1px solid var(--line);
      background:var(--card2);
      color:var(--text);
      font-weight:900;
      cursor:pointer;
      flex:1;
    }
    .btn.primary{
      background:linear-gradient(180deg, var(--red), var(--red2));
      border-color:rgba(255,255,255,.10);
      color:white;
    }
    .btn.danger{background:rgba(255,70,70,.10); border-color:rgba(255,70,70,.25)}
    .btn:disabled{opacity:.45; cursor:not-allowed}
    .adminFilters .field{
      background:var(--card2);
      border:1px solid var(--line);
      border-radius:12px;
      padding:8px 10px;
    }
    .adminFilters .field > span{color:var(--muted)}
    .adminFilters .field input,
    .adminFilters .field select{
      background:transparent;
      border:none;
      padding:5px 0 2px;
      font-size:13px;
    }
    .adminFilters .field input:focus,
    .adminFilters .field select:focus{
      border:none;
    }
    .adminFiltersBar{
      display:grid;
      gap:8px 10px;
      margin-top:10px;
      align-items:end;
    }
    .adminFiltersBar .btn{
      padding:10px 12px;
      font-size:13px;
      min-height:44px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .exportWrap{position:relative}
    .exportMenu{
      position:absolute;
      right:0;
      top:calc(100% + 8px);
      min-width:180px;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      box-shadow:var(--shadow);
      padding:8px;
      display:flex;
      flex-direction:column;
      gap:8px;
      z-index:30;
    }
    .menuBtn{
      display:inline-flex;
      align-items:center;
      justify-content:flex-start;
      gap:8px;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--line);
      background:var(--card2);
      color:var(--text);
      font-weight:900;
      cursor:pointer;
    }
    .modalOverlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.45);
      backdrop-filter: blur(10px);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:14px;
      z-index:9999;
    }
    @media (prefers-color-scheme: light){
      .modalOverlay{background:rgba(0,0,0,.25)}
    }
    .modalCard{
      width:min(720px, calc(100% - 28px));
      background:var(--card);
      color:var(--text);
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:var(--shadow);
      overflow:hidden;
      max-height:calc(100vh - 28px);
      max-height:calc(100dvh - 28px);
      display:flex;
      flex-direction:column;
    }
    .dlgInner{
      padding:16px;
      display:flex;
      flex-direction:column;
      gap:12px;
      overflow:auto;
      -webkit-overflow-scrolling:touch;
      max-height:calc(100vh - 28px);
      max-height:calc(100dvh - 28px);
    }
    .dlgTitle{font-weight:900; font-size:18px}
    .destGrid{
      display:grid;
      grid-template-columns: 1.2fr .6fr 1.6fr auto;
      gap:10px;
      align-items:center;
      margin-top:10px;
    }
    .destRow{
      display:grid;
      grid-template-columns: 1.2fr .6fr 1.6fr auto;
      gap:10px;
      align-items:center;
      padding:10px;
      border-radius:12px;
      border:1px solid var(--line);
      background:var(--card2);
      margin-top:8px;
    }
    .destActions{display:flex; gap:8px}
    .btn.exportBtn{
      padding:10px 12px;
      font-size:13px;
      border-radius:14px;
      min-height:44px;
      white-space:nowrap;
    }
    @media (min-width:1200px){
      .adminFiltersBar{
        grid-template-columns:
          minmax(200px, 1.4fr)
          minmax(120px, .9fr)
          minmax(120px, .9fr)
          minmax(120px, .8fr)
          minmax(120px, .8fr)
          minmax(150px, .9fr)
          minmax(130px, .8fr)
          minmax(130px, .8fr);
      }
    }
    @media (max-width:1199px){
      .adminFiltersBar{
        grid-template-columns: repeat(4, minmax(160px, 1fr));
      }
    }
    @media (max-width:900px){
      .adminFiltersBar{
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    .chips3{display:flex; gap:10px; margin-top:12px}
    .chip{
      flex:1;
      background:var(--card2);
      border:1px solid var(--line);
      border-radius:var(--radius2);
      padding:10px 12px;
      min-width:0;
    }
    .chipLabel{font-size:12px; color:var(--muted); font-weight:800; letter-spacing:.2px}
    .chipValue{
      margin-top:4px;
      font-family:var(--mono);
      font-size:18px;
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .list{display:flex; flex-direction:column; gap:10px; margin-top:10px; width:100%}
    .item{
      border:1px solid var(--line);
      background:var(--card2);
      border-radius:16px;
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .itemTop{display:flex; justify-content:space-between; gap:10px; align-items:center}
    .itemLeft{display:flex; align-items:center; gap:10px; min-width:0}
    .itemCheck{display:none; align-items:center}
    .itemCheck input{width:18px; height:18px; padding:0}
    .paidToggle{display:inline-flex; align-items:center; gap:6px; font-weight:800; color:var(--muted)}
    .paidToggle input{width:18px; height:18px; padding:0}
    .itemTitle{font-weight:900}
    .itemMeta{font-family:var(--mono); color:var(--muted); font-size:12px}
    .itemMetaGrid{
      display:grid;
      grid-template-columns:1.6fr 1.2fr 1.2fr .7fr .6fr;
      gap:8px;
      margin-top:8px;
    }
    .metaBox{
      border:1px solid var(--line);
      background:var(--card);
      border-radius:12px;
      padding:8px 10px;
      min-width:0;
    }
    .metaLabel{
      display:flex;
      align-items:center;
      gap:6px;
      font-size:11px;
      color:var(--muted);
      font-weight:800;
      letter-spacing:.2px;
    }
    .metaValue{
      margin-top:3px;
      font-family:var(--mono);
      font-size:14px;
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    @media (min-width:1100px){
      .itemTitle{font-size:18px}
      .metaValue{font-size:15px}
    }
    @media (max-width:980px){
      .itemMetaGrid{grid-template-columns:repeat(2, minmax(0, 1fr))}
    }
    .empty{
      text-align:center;
      color:var(--muted);
      padding:18px 8px;
      border:1px dashed var(--line);
      border-radius:16px;
      margin-top:10px;
    }
    .miniBtn{
      padding:10px 12px;
      border-radius:14px;
      border:1px solid var(--line);
      background:var(--card2);
      color:var(--text);
      cursor:pointer;
      font-weight:900;
      flex:0 0 auto;
    }
    .miniBtn.danger{background:rgba(255,70,70,.10); border-color:rgba(255,70,70,.25)}
    .listTools{align-items:center; flex-wrap:wrap}
    .selectedCount{font-size:12px; color:var(--muted); font-weight:800}
    .toggle{display:flex; align-items:center; gap:8px; user-select:none; color:var(--muted); font-weight:900}
    .toggle input{width:18px; height:18px}
    body:not(.selecting) .listTools{display:none}
    body.selecting .paidToggle{display:none}
    body.selecting .itemCheck{display:inline-flex}
    .msg{
      font-size:13px;
      color:var(--muted);
      margin-top:2px;
      min-height:18px;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid var(--line);
      background:rgba(0,0,0,.06);
      line-height:1.35;
    }
    @media (prefers-color-scheme: light){
      .msg{background:rgba(0,0,0,.03)}
    }
    .msg.ok{color:var(--good)}
    .msg.err{color:#ff6b6b}
    .hidden{display:none!important}
  </style>
</head>
<body>
  <svg class="iconSprite" aria-hidden="true">
    <symbol id="i-calendar" viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="16" rx="2"></rect>
      <path d="M16 3v4"></path>
      <path d="M8 3v4"></path>
      <path d="M3 9h18"></path>
    </symbol>
    <symbol id="i-mail" viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="14" rx="2"></rect>
      <path d="M3 7l9 6 9-6"></path>
    </symbol>
    <symbol id="i-list" viewBox="0 0 24 24">
      <path d="M8 6h12"></path>
      <path d="M8 12h12"></path>
      <path d="M8 18h12"></path>
      <circle cx="4" cy="6" r="1"></circle>
      <circle cx="4" cy="12" r="1"></circle>
      <circle cx="4" cy="18" r="1"></circle>
    </symbol>
    <symbol id="i-download" viewBox="0 0 24 24">
      <path d="M12 3v10"></path>
      <path d="M8 9l4 4 4-4"></path>
      <path d="M5 21h14"></path>
    </symbol>
    <symbol id="i-gear" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V22a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H2a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3 1.7 1.7 0 0 0 1-1.5V2a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8 1.7 1.7 0 0 0 1.5 1H22a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path>
    </symbol>
    <symbol id="i-close" viewBox="0 0 24 24">
      <path d="M6 6l12 12"></path>
      <path d="M18 6l-12 12"></path>
    </symbol>
    <symbol id="i-clock" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M12 7v5l3 2"></path>
    </symbol>
    <symbol id="i-pause" viewBox="0 0 24 24">
      <path d="M9 6v12"></path>
      <path d="M15 6v12"></path>
    </symbol>
    <symbol id="i-car" viewBox="0 0 24 24">
      <path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11"></path>
      <path d="M3 13h18v5a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-1H7v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-5z"></path>
      <path d="M7 11h10"></path>
      <circle cx="7.5" cy="16.5" r="1"></circle>
      <circle cx="16.5" cy="16.5" r="1"></circle>
    </symbol>
  </svg>
  <header class="topbar">
    <div class="brand">Timbratrice Admin</div>
    <div class="right">
      <button id="btnAdminSettings" class="iconBtn hidden" aria-label="Impostazioni">
        <svg class="icon" aria-hidden="true"><use href="#i-gear"></use></svg>
      </button>
    </div>
  </header>

  <main class="wrap">
    <section id="loginCard" class="card">
      <div class="h2">Accesso Admin</div>
      <div class="sub">Solo per l’account autorizzato</div>
      <div class="grid2">
        <label class="field">
          <span>Email</span>
          <input id="emailInput" type="email" placeholder="tuo@email.com" autocomplete="email">
        </label>
        <label class="field">
          <span>Password</span>
          <input id="passInput" type="password" placeholder="password" autocomplete="current-password">
        </label>
      </div>
      <div class="row">
        <button id="btnLogin" class="btn primary">Login</button>
      </div>
      <div id="authMsg" class="msg"></div>
    </section>

    <section id="adminCard" class="card hidden adminFilters">
      <div class="h2">Controllo Orari</div>
      <div class="sub">Filtra per utente, data e ordina i risultati</div>

      <div class="adminFiltersBar">
        <label class="field">
          <span>Seleziona utente</span>
          <select id="userSelect">
            <option value="">Tutte</option>
          </select>
        </label>
        <label class="field">
          <span>Pagato</span>
          <select id="paidFilter">
            <option value="">Tutti</option>
            <option value="paid">Pagati</option>
            <option value="unpaid">Non pagati</option>
          </select>
        </label>
        <label class="field">
          <span class="iconLabel">
            <svg class="icon xs" aria-hidden="true"><use href="#i-calendar"></use></svg>
            Da
          </span>
          <input id="fromDate" type="date" />
        </label>
        <label class="field">
          <span class="iconLabel">
            <svg class="icon xs" aria-hidden="true"><use href="#i-calendar"></use></svg>
            A
          </span>
          <input id="toDate" type="date" />
        </label>
        <label class="field">
          <span>Ordina per</span>
          <select id="sortField">
            <option value="start_ts">Inizio</option>
            <option value="end_ts">Fine</option>
            <option value="updated_at">Aggiornato</option>
          </select>
        </label>
        <label class="field">
          <span>Direzione</span>
          <select id="sortDir">
            <option value="desc">Discendente</option>
            <option value="asc">Ascendente</option>
          </select>
        </label>
        <div id="exportWrap" class="exportWrap">
          <button id="btnExportMenu" class="btn exportBtn" type="button" aria-haspopup="menu" aria-expanded="false">
            <span class="iconLabel">
              <svg class="icon xs" aria-hidden="true"><use href="#i-download"></use></svg>
              <span>Esporta</span>
            </span>
          </button>
          <div id="exportMenu" class="exportMenu hidden" role="menu" aria-label="Esporta">
            <button id="btnExportCsv" class="menuBtn" type="button" role="menuitem">CSV (filtro)</button>
            <button id="btnExportXlsx" class="menuBtn" type="button" role="menuitem">XLSX (Excel)</button>
            <button id="btnExportPdf" class="menuBtn" type="button" role="menuitem">PDF</button>
          </div>
        </div>
      </div>

      <div class="chips3">
        <div class="chip">
          <div class="chipLabel">
            <span class="iconLabel">
              <svg class="icon xs" aria-hidden="true"><use href="#i-list"></use></svg>
              Record
            </span>
          </div>
          <div class="chipValue" id="sumRecords">0</div>
        </div>
        <div class="chip">
          <div class="chipLabel">
            <span class="iconLabel">
              <svg class="icon xs" aria-hidden="true"><use href="#i-clock"></use></svg>
              Ore nette
            </span>
          </div>
          <div class="chipValue" id="sumHours">0:00</div>
        </div>
        <div class="chip">
          <div class="chipLabel">
            <span class="iconLabel">
              <svg class="icon xs" aria-hidden="true"><use href="#i-car"></use></svg>
              Km
            </span>
          </div>
          <div class="chipValue" id="sumKm">0</div>
        </div>
      </div>

      <div class="row">
        <button id="btnSelectMode" class="miniBtn" type="button">Seleziona</button>
      </div>
      <div class="row listTools">
        <label class="toggle">
          <input id="selectAllToggle" type="checkbox" />
          <span>Seleziona tutti</span>
        </label>
        <div id="selectedCount" class="selectedCount">0 selezionati</div>
        <button id="btnMarkPaid" class="miniBtn" type="button" disabled>Segna pagati</button>
        <button id="btnMarkUnpaid" class="miniBtn" type="button" disabled>Segna non pagati</button>
      </div>

      <div id="actionMsg" class="msg"></div>
      <div id="list" class="list"></div>
      <div id="empty" class="empty hidden">Nessun record</div>
    </section>
  </main>

  <div id="settingsOverlay" class="modalOverlay hidden" role="dialog" aria-modal="true" aria-label="Account e impostazioni">
    <div class="modalCard">
      <form class="dlgInner" onsubmit="return false;">
        <div class="dlgTitle">Account & Impostazioni</div>

        <div id="settingsHome">
          <div class="row">
            <button id="btnOpenDestinations" class="btn" type="button">Destinazioni</button>
          </div>
          <div class="row">
            <button id="btnAdminDiag" class="btn" type="button">Diagnostica</button>
            <button id="btnAdminLogout" class="btn danger" type="button">Logout</button>
          </div>
        </div>

function isoDate(isoTs){
  if(!isoTs) return "";
  const d = new Date(isoTs);
  const yyyy = d.getFullYear();
  const mm = pad2(d.getMonth()+1);
  const dd = pad2(d.getDate());
  return `${yyyy}-${mm}-${dd}`;
}

function initDateRangeFromRecordsOnce(){
  if(autoDateInitialized) return;
  if(!records || records.length === 0) return;

  const dates = records
    .map(r => r.start_ts)
    .filter(Boolean)
    .map(ts => new Date(ts))
    .filter(d => !isNaN(d.getTime()));

  if(dates.length === 0) return;

  dates.sort((a,b)=> a.getTime() - b.getTime());
  const minD = dates[0];
  const maxD = dates[dates.length-1];

  // Only set if user hasn't already picked dates
  const fromEl = $("fromDate");
  const toEl = $("toDate");
  if(!fromEl.value) fromEl.value = isoDate(minD.toISOString());
  if(!toEl.value) toEl.value = isoDate(maxD.toISOString());

  autoDateInitialized = true;
}

function withTimeout(promise, ms, label){
  let timerId;
  const timeout = new Promise((_, reject)=>{
    timerId = setTimeout(()=>{
      reject(new Error(`${label} non risponde. Riprova.`));
    }, ms);
  });
  return Promise.race([promise, timeout]).finally(()=> clearTimeout(timerId));
}

async function fetchWithTimeout(url, options, ms=12000, label="Richiesta"){
  return withTimeout(fetch(url, options), ms, label);
}

function buildRestHeaders(token){
  return {
    apikey: SUPABASE_ANON_KEY,
    Authorization: `Bearer ${token || SUPABASE_ANON_KEY}`,
    "Content-Type": "application/json",
  };
}

async function restGet(path, token, ms=12000, label="Caricamento"){
  const url = `${SUPABASE_URL}${path}`;
  const res = await fetchWithTimeout(url, { method: "GET", headers: buildRestHeaders(token) }, ms, label);
  const text = await res.text();
  let json = null;
  try{ json = text ? JSON.parse(text) : null; }catch{ json = null; }
  if(!res.ok){
    const msg = (json && (json.message || json.error || json.error_description)) || text || `HTTP ${res.status}`;
    const err = new Error(msg);
    err.status = res.status;
    err.body = json || text;
    throw err;
  }
  return json;
}

async function refresh(){
  const user = await getUser();
  const userEmailNorm = (user?.email || "").trim().toLowerCase();
  if(!user || userEmailNorm !== ADMIN_EMAIL_NORM){
    setAuthUI(user);
    return;
  }

  const token = getToken();
  if(!token){
    setActionMsg("❌ Nessuna sessione/token. Rifai Login.", "err");
    return;
  }

  const userFilterId = ($("userSelect").value || "").trim();
  const paidFilter = ($("paidFilter").value || "").trim();
  const fromDate = $("fromDate").value;
  const toDate = $("toDate").value;
  const sortField = $("sortField").value;
  const sortAsc = $("sortDir").value === "asc";

  try{
    setActionMsg("⏳ Caricamento...", null);

    // Build PostgREST querystring
    const params = [];
    params.push("select=*");
    if(userFilterId) params.push(`user_id=eq.${encodeURIComponent(userFilterId)}`);
    if(paidFilter === "paid") params.push("paid=is.true");
    if(paidFilter === "unpaid") params.push("or=(paid.is.false,paid.is.null)");
    if(fromDate) params.push(`start_ts=gte.${encodeURIComponent(new Date(fromDate + "T00:00:00").toISOString())}`);
    if(toDate) params.push(`start_ts=lte.${encodeURIComponent(new Date(toDate + "T23:59:59").toISOString())}`);
    params.push(`order=${encodeURIComponent(sortField)}.${sortAsc ? "asc" : "desc"}`);

    const path = `/rest/v1/work_records_admin_view?${params.join("&")}`;
    const data = await restGet(path, token, 12000, "Caricamento");

    records = data || [];
    renderSummary();
    renderList();
    initDateRangeFromRecordsOnce();

    if(records.length === 0){
      setActionMsg("⚠️ Nessun record trovato (filtri troppo stretti o dati assenti).", "err");
    }else{
      setActionMsg(`✅ ${records.length} record`, "ok");
    }
  }catch(err){
    console.error(err);
    setActionMsg(`❌ ${err.message || String(err)}${err.status ? ` (HTTP ${err.status})` : ""}`, "err");
  }
}

async function upsertDestination(dest){
  const token = getToken();
  if(!token) throw new Error("Sessione non valida: rifai Login.");
  const payload = {
    id: dest.id || newId(),
    name: dest.name || "",
    km: Number(dest.km || 0),
    maps_url: dest.maps_url || null,
    updated_at: new Date().toISOString()
  };
  const url = `${SUPABASE_URL}/rest/v1/destinations`;
  const headers = {
    ...buildRestHeaders(token),
    Prefer: "resolution=merge-duplicates,return=representation"
  };
  const res = await fetchWithTimeout(url, {
    method: "POST",
    headers,
    body: JSON.stringify(payload)
  }, 12000, "Salvataggio destinazione");
  const text = await res.text();
  let json = null;
  try{ json = text ? JSON.parse(text) : null; }catch{ json = null; }
  if(!res.ok){
    const msg = (json && (json.message || json.error || json.error_description)) || text || `HTTP ${res.status}`;
    const err = new Error(msg);
    err.status = res.status;
    throw err;
  }
  return json;
}

async function deleteDestination(id){
  if(!id) return;
  const token = getToken();
  if(!token) throw new Error("Sessione non valida: rifai Login.");
  const url = `${SUPABASE_URL}/rest/v1/destinations?id=eq.${encodeURIComponent(id)}`;
  const headers = {
    ...buildRestHeaders(token),
    Prefer: "return=minimal"
  };
  const res = await fetchWithTimeout(url, {
    method: "DELETE",
    headers
  }, 12000, "Eliminazione destinazione");
  if(!res.ok){
    const text = await res.text();
    let json = null;
    try{ json = text ? JSON.parse(text) : null; }catch{ json = null; }
    const msg = (json && (json.message || json.error || json.error_description)) || text || `HTTP ${res.status}`;
    const err = new Error(msg);
    err.status = res.status;
    throw err;
  }
}


    function exportCSV(){
      const sep = ";";
      const rows = [...records];

      const dt = (iso)=>{
        if(!iso) return "";
        const d = new Date(iso);
        const yyyy = d.getFullYear();
        const mm = pad2(d.getMonth()+1);
        const dd = pad2(d.getDate());
        const HH = pad2(d.getHours());
        const MI = pad2(d.getMinutes());
        return `${yyyy}/${mm}/${dd} ${HH}:${MI}`;
      };

      let csv = "\uFEFF";
      csv += ["Utente","Titolo","DataOraInizio","DataOraFine","Pausa_min","Ore_nette_hh:mm","Km"].join(sep) + "\r\n";

      let sumWork = 0, sumKm = 0;
      for(const r of rows){
        sumWork += Number(r.work_min||0);
        sumKm += Number(r.km||0);
        csv += [
          csvEscape(getUserLabelFromRecord(r), sep),
          csvEscape(r.title||"", sep),
          dt(r.start_ts),
          dt(r.end_ts),
          String(Number(r.pause_min||0)),
          fmtHM(Number(r.work_min||0)),
          String(Number(r.km||0))
        ].join(sep) + "\r\n";
      }

      csv += ["TOTALE SELEZIONE","","","", fmtHM(sumWork), String(sumKm)].join(sep) + "\r\n";

      const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `timbratrice-admin-${Date.now()}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function exportXLSX(){
      if(!window.XLSX){
        setActionMsg("❌ XLSX non disponibile (libreria non caricata).", "err");
        return;
      }
      const rows = [...records];
      if(rows.length === 0){
        setActionMsg("Nessun record da esportare.", "err");
        return;
      }

      const header = ["Utente","Titolo","DataOraInizio","DataOraFine","Pausa_min","Ore_nette","Km"];
      const data = [header];
      let sumWork = 0;
      let sumKm = 0;
      let sumPause = 0;

      for(const r of rows){
        const start = r.start_ts ? new Date(r.start_ts) : "";
        const end = r.end_ts ? new Date(r.end_ts) : "";
        const pauseMin = Number(r.pause_min || 0);
        const workMin = Number(r.work_min || 0);
        const km = Number(r.km || 0);
        sumPause += pauseMin;
        sumWork += workMin;
        sumKm += km;

        data.push([
          getUserLabelFromRecord(r),
          r.title || "",
          start instanceof Date && !isNaN(start.getTime()) ? start : "",
          end instanceof Date && !isNaN(end.getTime()) ? end : "",
          pauseMin,
          workMin / 1440,
          km
        ]);
      }

      data.push(["TOTALE SELEZIONE","","","", sumPause, sumWork / 1440, sumKm]);

      const ws = XLSX.utils.aoa_to_sheet(data, { cellDates: true });
      ws["!cols"] = [
        { wch: 26 },
        { wch: 28 },
        { wch: 20 },
        { wch: 20 },
        { wch: 12 },
        { wch: 12 },
        { wch: 10 }
      ];

      for(let r = 1; r < data.length; r++){
        const startCell = XLSX.utils.encode_cell({ r, c: 2 });
        const endCell = XLSX.utils.encode_cell({ r, c: 3 });
        const workCell = XLSX.utils.encode_cell({ r, c: 5 });
        if(ws[startCell] && ws[startCell].v instanceof Date){
          ws[startCell].z = "yyyy-mm-dd hh:mm";
        }
        if(ws[endCell] && ws[endCell].v instanceof Date){
          ws[endCell].z = "yyyy-mm-dd hh:mm";
        }
        if(ws[workCell]){
          ws[workCell].t = "n";
          ws[workCell].z = "[h]:mm";
        }
      }

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Turni");
      XLSX.writeFile(wb, `timbratrice-admin-${Date.now()}.xlsx`);
    }

    function csvEscape(s, sep){
      const t = String(s||"").trim();
      if(t.includes(sep) || t.includes('"') || t.includes("\n") || t.includes("\r")){
        return `"${t.replace(/"/g,'""')}"`;
      }
      return t;

async function doLogout(){
  try{
    await sb.auth.signOut();
  }catch(err){
    console.warn("Logout error:", err);
  }
  currentSession = null;
  currentUser = null;
  records = [];
  setSelectionMode(false);
  setAuthUI(null);
  setAuthMsg("✅ Logout", "ok");
  setSettingsMsg("✅ Logout", "ok");
}

$("btnLogin").addEventListener("click", async ()=>{
  try{
    setAuthMsg("⏳ Login...", null);
    const email = ($("emailInput").value||"").trim();
    const pass = ($("passInput").value||"").trim();
    if(!email || !pass) throw new Error("Inserisci email e password.");
    const { data, error } = await withTimeout(
      sb.auth.signInWithPassword({ email, password: pass }),
      10000,
      "Login"
    );
    if(error) throw error;
    if(!data?.session) throw new Error("Login non riuscito.");
    currentSession = data.session;
    setAuthMsg("✅ Login OK", "ok");
    setAuthUI(data.session.user);
    await loadUsers();
    await refresh();
  }catch(err){
    setAuthMsg("❌ " + (err.message || String(err)), "err");
  }
});

      if(!exportMenu || !exportBtn) return;
      exportMenu.classList.add("hidden");
      exportBtn.setAttribute("aria-expanded", "false");
    }
    function toggleExportMenu(){
      if(!exportMenu || !exportBtn) return;
      const open = exportMenu.classList.contains("hidden");
      exportMenu.classList.toggle("hidden", !open);
      exportBtn.setAttribute("aria-expanded", open ? "true" : "false");
    }
    if(exportBtn){
      exportBtn.addEventListener("click", (e)=>{
        e.preventDefault();
        toggleExportMenu();
      });
    }

      exportCSV();
      closeExportMenu();
    });

      exportPDF();
      closeExportMenu();
